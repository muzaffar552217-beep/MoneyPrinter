name: mindfacto-daily-short
on:
  schedule:
    - cron: "30 3 * * *"   # रोज़ सुबह 9:00 IST
  workflow_dispatch:        # फ़ोन से हाथ से चलाने के लिए
    inputs:
      dry_run:
        description: "1 = सिर्फ़ वीडियो बनाओ, अपलोड मत करो"
        default: "0"
permissions:
  contents: write
jobs:
  make-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mindfacto-auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          pip install -r requirements.txt
      - name: Make and upload video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # ज़रूरत हो तो नीचे की चार लाइनें बदलें
          TOPIC: "everyday life hacks"
          VOICE: "hi-IN-MadhurNeural"
          PRIVACY: "public"
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python main.py
      - name: Save history
        run: |
          git config user.name "mindfacto-bot"
          git config user.email "bot@users.noreply.github.com"
          git add mindfacto-auto/history.json
          git commit -m "update history" || echo "nothing to commit"
          git push || true
